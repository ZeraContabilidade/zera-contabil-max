[project]
name = "zera-contabil-max"
version = "0.1.0"
description = "Classificação automática de extratos bancários e geração do lanctos.txt para o Domínio"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# padrão do FastAPI: Depends/Form como valor padrão do parâmetro
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query", "fastapi.File"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not ia_real"'
markers = [
    "banco: precisa do PostgreSQL rodando (Docker)",
    "ia_real: chama a API real da Anthropic e custa dinheiro (rode com: pytest -m ia_real)",
]
