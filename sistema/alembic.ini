# Migrações do banco (Alembic). O endereço do banco vem do .env (app/config.py).
# Aplicadas sozinhas pelo INSTALAR.bat e pelo INICIAR.bat.
# Nova migração: .venv\Scripts\alembic revision --autogenerate -m "descricao" --rev-id 0002

[alembic]
script_location = %(here)s/migracoes
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
