{% extends "base.html" %}
{% block titulo %}Minha senha — {{ nome_sistema }}{% endblock %}
{% block conteudo %}
<h1>Trocar minha senha</h1>
<article>
  {% if erro %}<p class="aviso aviso-erro" role="alert">{{ erro }}</p>{% endif %}
  <form method="post" action="/minha-senha">
    <label>Senha atual <input type="password" name="senha_atual" autocomplete="current-password" required autofocus></label>
    <div class="grid">
      <label>Nova senha <small class="suave">(mínimo 8 caracteres)</small>
        <input type="password" name="senha" autocomplete="new-password" required>
      </label>
      <label>Repita a nova senha <input type="password" name="confirmacao" autocomplete="new-password" required></label>
    </div>
    <button type="submit">Trocar senha</button>
  </form>
</article>
{% endblock %}
