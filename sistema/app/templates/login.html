{% extends "_entrada.html" %}
{% block titulo %}Entrar — {{ nome_sistema }}{% endblock %}
{% block formulario %}
<h1>Entrar</h1>
<p class="suave">Use o usuário e a senha que o Supervisor cadastrou.</p>
{% if erro %}<p class="aviso aviso-erro" role="alert">{{ erro }}</p>{% endif %}
<form method="post" action="/login">
  <input type="hidden" name="proximo" value="{{ proximo }}">
  <label>Usuário ou e-mail
    <input name="login" value="{{ login }}" autocomplete="username" required autofocus>
  </label>
  <label>Senha
    <input type="password" name="senha" autocomplete="current-password" required>
  </label>
  <button type="submit">Entrar</button>
</form>
<small class="suave">Esqueceu a senha? Peça ao Supervisor para definir uma nova.</small>
{% endblock %}
