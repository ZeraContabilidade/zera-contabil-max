# Só o banco de dados roda no Docker. As senhas vêm do arquivo .env.
name: zera-contabil-max

services:
  banco:
    image: postgres:16
    container_name: zera-contabil-max-banco
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      # só este computador acessa o banco; o sistema web é que fica na rede
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - dados_banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dados_banco:
