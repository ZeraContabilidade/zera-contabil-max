<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}{{ nome_sistema }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='vendor/pico.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='estilo.css') }}">
  <script src="{{ url_for('static', path='vendor/htmx.min.js') }}" defer></script>
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><a href="/" class="marca"><strong>{{ nome_sistema }}</strong></a></li></ul>
    </nav>
  </header>
  <main class="container">
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
